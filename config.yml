app:
  title: "AMR Dashboard"
  font_family: "Inter"

colors:
  trend_line: "#6EA6CF"
  landelijk_gem: "#B9C6D6"
  grid: "#E9EEF5"
  axis: "#6B7C93"
  label_dark: "#1F3B63"

  trend_gradient_rgb: [110, 166, 207]
  trend_gradient_bands: 50
  trend_gradient_alpha: 0.30

  map_bins:
    - "#D1E6C9"
    - "#B7D9B1"
    - "#99C5D3"
    - "#6EA6CF"

  micro:
    ESBL: "#6EA6CF"
    MRSA: "#95B9C7"
    VRE: "#ACCCBB"
    CPE: "#C2DEAF"
